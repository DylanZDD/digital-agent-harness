# ─────────────────────────────────────────────────────────────
# Agent Harness 配置
# 优先级: CLI 参数 > 本文件 > 环境变量 > 代码默认值
# ─────────────────────────────────────────────────────────────

llm:
  provider: zhipu          # openai | ollama | vllm | zhipu
  model: glm-5.3
  base_url: https://open.bigmodel.cn/api/coding/paas/v4   # 留空则用各 provider 默认
  api_key: null                       # 留空则读 ZHIPU_API_KEY / GLM_API_KEY 环境变量
  temperature: 0.2
  max_tokens: 8192
  stream: true                  # 流式输出;端点不兼容时改 false
  quick_models:                        # /model 菜单快捷选择;base_url 缺省用上面 llm.base_url
    - glm-5.3
    - glm-5.2
    - model: glm-5.3-flash
      base_url: https://open.bigmodel.cn/api/paas/v4   # 多模态走通用端点,非 Coding Plan
    - model: glm-4.6v-flash
      base_url: https://open.bigmodel.cn/api/paas/v4

agent:
  max_iterations: 100        # 单轮对话最大工具调用迭代数,防止死循环
  system_prompt: null       # 覆盖默认人设提示词,null 用内置编程助手人设
  session_dir: null         # 会话持久化目录(每轮自动保存),null = ~/.digital-agent-harness/sessions

tools:
  workdir: .                # 文件系统工具的根目录(沙箱边界)
  enable_filesystem: true
  enable_shell: true
  shell_timeout: 120        # shell 工具单次执行超时(秒)
  shell_allowlist: []       # 为空则允许任意命令;非空则只允许列表前缀,如 ["git", "ls", "python"]

skills:
  dir: skills               # skills 目录,存放 SKILL.md

mcp:
  servers:
    12306-mcp:
      enabled: false            # false 则启动时不连接该服务器
      type: streamable_http
      url: https://mcp.api-inference.modelscope.net/ce97681a20494c/mcp
    time:
      enabled: false
      type: streamable_http
      url: https://mcp.api-inference.modelscope.net/71d3418d697344/mcp
